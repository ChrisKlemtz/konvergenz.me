# Veröffentlicht die Website bei jedem Push auf main per FTPS auf den Webspace.
# Secrets (GitHub → Settings → Secrets and variables → Actions):
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, FTP_DIR (z. B. /konvergenz53/)
name: Deploy auf Webspace

# Vorerst nur manuell startbar, weil es noch kein Webhosting gibt.
# Sobald Hosting und Secrets stehen, die drei Zeilen unten wieder einkommentieren.
on:
  # push:
  #   branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Per FTPS hochladen
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR }}
          protocol: ftps
          # Inhalte aus dem Dashboard leben nur auf dem Server und werden nie überschrieben
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            data/*.json
            data/*.tmp
            uploads/library/**
